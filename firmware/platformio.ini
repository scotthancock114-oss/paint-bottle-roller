; PlatformIO build for the Paint Bottle Roller v1.
; Arduino IDE users: open firmware/PaintRoller/PaintRoller.ino instead and install
; FastAccelStepper, TMCStepper and U8g2 from the Library Manager.

[platformio]
src_dir = PaintRoller

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    gin66/FastAccelStepper
    teemuatlut/TMCStepper
    olikraus/U8g2
build_flags =
    -D ENABLE_WIFI=1
